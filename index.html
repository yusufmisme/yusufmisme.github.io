<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yusufmisme.github.io</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 2rem;
      padding: 1.5rem;
    }
    main {
      text-align: center;
      width: min(100%, 48rem);
    }
    h1 {
      font-size: clamp(1.8rem, 8vw, 4rem);
      line-height: 1.1;
      overflow-wrap: anywhere;
      margin: 0 0 1.25rem;
    }
    h2 {
      font-size: clamp(1.4rem, 6vw, 2.5rem);
      margin: 0 0 0.9rem;
    }
    a {
      color: #000;
      font-family: inherit;
      font-size: clamp(1rem, 4vw, 1.5rem);
    }
    main > a { display: block; }
    .typing-text {
      visibility: hidden;
    }
    .fade-in-item {
      opacity: 0;
      transform: translateY(8px);
    }
    .fade-in-item.is-visible {
      animation: fade-up 350ms ease forwards;
    }
    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-in-item { opacity: 1; transform: none; }
      .fade-in-item.is-visible { animation: none; }
    }
    @media (max-width: 360px) {
      body { padding: 1rem; }
      h1 { font-size: clamp(1.5rem, 8vw, 1.8rem); }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="typing-text">yusufmisme.github.io</h1>
    <a class="fade-in-item" href="https://yusufmisme.github.io/Guzzle/"><h2>Guzzle</h2></a>
    <a class="fade-in-item" href="https://www.5189wolvesrobotics.com/"><h2>Wolves Robotics</h2></a>
    <a class="fade-in-item" href="https://sites.google.com/view/sstmualphatheta/home"><h2>SST Mu Alpha Theta</h2></a>
    <a class="fade-in-item" href="https://github.com/yusufmisme"><h2>GitHub Profile</h2></a>
    <!--<a class="fade-in-item" href="https://yusufmisme.github.io/Guzzle/"><h2>Test</h2></a>-->
  </main>
  <script>
    const title = document.querySelector("h1.typing-text")
    const links = [...document.querySelectorAll("main > a.fade-in-item")]

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      title.style.visibility = "visible"
      links.forEach((link) => link.classList.add("is-visible"))
    } else {
      const fullTitle = title.textContent
      title.textContent = ""
      title.style.visibility = "visible"
      let characterIndex = 0

      function typeCharacter() {
        title.textContent = fullTitle.slice(0, ++characterIndex)
        if (characterIndex < fullTitle.length) {
          window.setTimeout(typeCharacter, 35)
        } else {
          links.forEach((link, index) => {
            window.setTimeout(() => link.classList.add("is-visible"), index * 220)
          })
        }
      }

      typeCharacter()
    }
  </script>
</body>
</html>
